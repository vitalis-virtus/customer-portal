# Artifact Registry — Simplified Artifact Contracts MVP (APPROVED (MVP), 2026-11-17)
#
# The single source of paths and owners of Story Workflow artifacts.
#
# Rules:
#   - Stage Skills and the Orchestrator take paths only from this file. A Skill may show an
#     example path, but does not define its own paths.
#   - An artifact key is a logical identifier from stages.md, section 5.
#   - produced_by — the stage (or the Orchestrator) that has the right to create files of this type.
#     Other stages only read the artifact.
#   - Placeholders: {story_id} — for example US-001; {version} — an integer from 1;
#     {nnnn} — the sequence number of a record of this type within the Story (0001, 0002, …);
#     {nnn} — the number of a Foundation Change Request within the Story; {entry_id} — BL-001, BL-002, …
#   - Metadata, versions and statuses — artifact-rules.md. Workflow State — workflow-state.md.
#   - Stage inputs and outputs — stage-io-map.yaml.

version: 1

storage_root: docs/stories     # Fixed for the MVP. Limitations — README.md, section "Storage".

categories:
  controlled: >-
    A controlled document. Has versions v1, v2, …; a published version is immutable.
    Version Status and Currency are stored only in state.yaml.
  record: >-
    A supporting record. Immutable after registration, has no lifecycle of its own.
    A correction is a new record.
  project: A project-level record outside the Story directory.
  source: >-
    An external source that the Story reads but does not change. Its version is the git commit
    of the file's last change (artifact-rules.md, section 3).

# ---------------------------------------------------------------------------
# Controlled Story documents
# ---------------------------------------------------------------------------

artifacts:

  clarification-record:
    category: controlled
    path: docs/stories/{story_id}/artifacts/clarification-record/v{version}.md
    produced_by: CLARIFICATION
    approval_gate: HUMAN_SPEC_APPROVAL
    note: Questions, answers and decisions of the human regarding the Story.

  story-spec:
    category: controlled
    path: docs/stories/{story_id}/artifacts/story-spec/v{version}.md
    produced_by: SPECIFICATION
    approval_gate: HUMAN_SPEC_APPROVAL
    note: Story Type, Acceptance Criteria (AC-NN) and the Verification Method of each criterion.

  impact-analysis:
    category: controlled
    path: docs/stories/{story_id}/artifacts/impact-analysis/v{version}.md
    produced_by: IMPACT_ANALYSIS
    approval_gate: HUMAN_TECHNICAL_APPROVAL     # if the stage is applicable

  solution-design:
    category: controlled
    path: docs/stories/{story_id}/artifacts/solution-design/v{version}.md
    produced_by: SOLUTION_DESIGN
    approval_gate: HUMAN_TECHNICAL_APPROVAL

  api-design:
    category: controlled
    path: docs/stories/{story_id}/artifacts/api-design/v{version}.md
    produced_by: API_DESIGN
    approval_gate: HUMAN_TECHNICAL_APPROVAL     # if the stage is applicable

  db-design:
    category: controlled
    path: docs/stories/{story_id}/artifacts/db-design/v{version}.md
    produced_by: DB_DESIGN
    approval_gate: HUMAN_TECHNICAL_APPROVAL     # if the stage is applicable

  implementation-plan:
    category: controlled
    path: docs/stories/{story_id}/artifacts/implementation-plan/v{version}.md
    produced_by: IMPLEMENTATION_PLANNING
    approval_gate: HUMAN_TECHNICAL_APPROVAL
    note: Steps, Story Risk Assessment, Testing Approach, planned Optional Stages.

  implementation-changeset:
    category: controlled
    path: docs/stories/{story_id}/artifacts/implementation-changeset/v{version}.md
    produced_by: IMPLEMENTATION                 # only IMPLEMENTATION (RR-10)
    approval_gate: HUMAN_PR_APPROVAL
    note: >-
      A description of code and test changes: feature branch, base_commit, changeset_commit, changed files.
      The code itself lives in Git. A new version — every time changeset_commit changes.

  foundation-change-request:
    category: controlled
    path: docs/stories/{story_id}/artifacts/foundation-change-request/{nnn}/v{version}.md
    produced_by: ANY_STAGE                      # through BLOCKED (Foundation Change Required)
    note: A request to change the Product or Architecture Foundation. Decided by a human outside the Story.

# ---------------------------------------------------------------------------
# Supporting Story records
# ---------------------------------------------------------------------------

records:

  review-report:
    category: record
    path: docs/stories/{story_id}/records/review-report/{nnnn}.md
    produced_by: [SPEC_REVIEW, DESIGN_REVIEW, PLAN_REVIEW, CODE_REVIEW, SECURITY_REVIEW]
    approval_gate: HUMAN_PR_APPROVAL            # only the CODE_REVIEW and SECURITY_REVIEW reports
    note: Verdict and findings regarding specific versions. Other reports are part of the gate's decision package.

  revalidation-record:
    category: record
    path: docs/stories/{story_id}/records/revalidation-record/{nnnn}.md
    produced_by: OWNER_STAGE                    # the owner stage of the artifact or record being checked
    note: An unchanged version remains current relative to new upstream versions.

  applicability-decision:
    category: record
    path: docs/stories/{story_id}/records/applicability-decision/{nnnn}.md
    produced_by: [IMPACT_ANALYSIS, API_DESIGN, DB_DESIGN, IMPLEMENTATION_PLANNING, SECURITY_REVIEW, RECONCILIATION]
    approval_gate: [HUMAN_TECHNICAL_APPROVAL, HUMAN_PR_APPROVAL]
    note: >-
      An assessment of the triggers of an Optional Stage (applicability_conditions in stage-map.yaml).
      IMPLEMENTATION_PLANNING creates planned decisions for SECURITY_REVIEW and RECONCILIATION;
      the stages themselves — decisions on entry (AP-06).

  reconciliation-report:
    category: record
    path: docs/stories/{story_id}/records/reconciliation-report/{nnnn}.md
    produced_by: RECONCILIATION
    approval_gate: HUMAN_PR_APPROVAL            # if RECONCILIATION is applicable

  verification-report:
    category: record
    path: docs/stories/{story_id}/records/verification-report/{nnnn}.md
    produced_by: VERIFICATION
    approval_gate: HUMAN_PR_APPROVAL
    note: Check results, Findings Disposition, FOLLOW_UP, DoD state, verified_target_base.

  pull-request:
    category: record
    path: docs/stories/{story_id}/records/pull-request/{nnnn}.md
    produced_by: PR_PREPARATION
    approval_gate: HUMAN_PR_APPROVAL
    note: Repository, PR number, source and target branch, changeset version. PR metadata is not part of the identity (RR-12).

  integration-record:
    category: record
    path: docs/stories/{story_id}/records/integration-record/{nnnn}.md
    produced_by: INTEGRATION_CONFIRMATION

  post-merge-validation-record:
    category: record
    path: docs/stories/{story_id}/records/post-merge-validation-record/{nnnn}.md
    produced_by: INTEGRATION_CONFIRMATION
    note: Only if the target branch changed before the merge. Not part of any Approval Scope.

  risk-acceptance-record:
    category: record
    path: docs/stories/{story_id}/records/risk-acceptance-record/{nnnn}.md
    produced_by: ORCHESTRATOR                   # records a human's decision; the agent does not accept risk

  foundation-exception-record:
    category: record
    path: docs/stories/{story_id}/records/foundation-exception-record/{nnnn}.md
    produced_by: ORCHESTRATOR                   # records a human's decision under the Foundation procedure

  cancellation-record:
    category: record
    path: docs/stories/{story_id}/records/cancellation-record/{nnnn}.md
    produced_by: ORCHESTRATOR                   # during CANCEL (Cancellation Protocol)

# ---------------------------------------------------------------------------
# Project level
# ---------------------------------------------------------------------------

project:

  backlog-entry:
    category: project
    path: docs/backlog/{entry_id}.md
    produced_by: [INTEGRATION_CONFIRMATION, ORCHESTRATOR]   # FOLLOW_UP; the Orchestrator — during Cancellation
    note: A record for an approved FOLLOW_UP with a reference to the Story and the Finding (PRQ-01).

# ---------------------------------------------------------------------------
# External sources (read, not changed within a Story)
# ---------------------------------------------------------------------------

sources:

  story-source:
    category: source
    path: docs/product/epic-map.md              # FEATURE; for other types — backlog-entry
  product-foundation:
    category: source
    path: docs/product/
  architecture-foundation:
    category: source
    path: docs/architecture/
  workflow-definition:
    category: source
    path: docs/workflow/
  testing-strategy:
    category: source
    path: docs/architecture/testing-strategy.md # FG-01: DRAFT, pending human approval
  merge-protection-policy:
    category: source
    path: null                                  # not defined yet (PRQ-02)
  codebase:
    category: source
    path: .                                     # the code state in Git; the version is a commit
  story-history:
    category: source
    path: docs/stories/{story_id}/history.jsonl # written only by the Orchestrator (workflow-state.md); stages only read it
