# Stage I/O Map — Simplified Artifact Contracts MVP (APPROVED (MVP), 2026-11-17)
#
# Logical inputs and outputs of each of the 22 stages of docs/workflow/stage-map.yaml (revision 3).
# Routes, verdicts, loopbacks, gates and the Approval Scope are defined only by stage-map.yaml:
# they are not repeated here.
#
# Key values — from artifact-registry.yaml (artifacts, records, project, sources).
#
# Input or output format:
#   - <key>                          — mandatory
#   - { key: <key>, when: <condition> }  — only under the condition
# The condition "applicable" means that the corresponding Optional Stage is applicable
# (there is an applicability-decision with result APPLICABLE).
#
# Common rules (not repeated below):
#   R1  Inputs — only registered current versions with Currency CURRENT (artifact-rules.md, section 4).
#   R2  On re-entry, a producer stage may create a revalidation-record instead of a new version
#       if the upstream change did not affect its artifact. Review stages on a repeated pass
#       also read revalidation-record.
#   R3  A human gate and a human action do not create artifacts. The decision is recorded by the Orchestrator:
#       an approval — in state.yaml → approvals, anything else — in history.jsonl (workflow-state.md).
#       CANCEL at any stage → cancellation-record (Cancellation Protocol).
#   R4  outputs_if_applicable are created only with result APPLICABLE; applicability-decision —
#       always, on every entry of an Optional Stage.

version: 1

stages:

  # ---------------- CLARIFICATION ----------------

  CLARIFICATION:
    inputs:
      - story-source
      - product-foundation
      - { key: architecture-foundation, when: "Story Type TECHNICAL or INFRASTRUCTURE" }
    outputs:
      - clarification-record          # the human's answers (CLARIFICATION_ANSWERS) go here

  # ---------------- SPECIFICATION ----------------

  SPECIFICATION:
    inputs: [clarification-record, story-source, product-foundation]
    outputs: [story-spec]

  SPEC_REVIEW:
    inputs: [story-spec, clarification-record, story-source, product-foundation]
    outputs: [review-report]

  HUMAN_SPEC_APPROVAL:
    inputs: [clarification-record, story-spec, review-report]   # the decision package
    outputs: []                                                  # R3

  # ---------------- TECHNICAL_DESIGN ----------------

  IMPACT_ANALYSIS:
    inputs: [story-spec, codebase, architecture-foundation]
    outputs: [applicability-decision]
    outputs_if_applicable: [impact-analysis]

  SOLUTION_DESIGN:
    inputs:
      - story-spec
      - architecture-foundation
      - { key: impact-analysis, when: applicable }
    outputs: [solution-design]

  API_DESIGN:
    inputs: [story-spec, solution-design, architecture-foundation]
    outputs: [applicability-decision]
    outputs_if_applicable: [api-design]

  DB_DESIGN:
    inputs:
      - story-spec
      - solution-design
      - architecture-foundation
      - { key: api-design, when: applicable }
      - { key: impact-analysis, when: applicable }
    outputs: [applicability-decision]
    outputs_if_applicable: [db-design]

  DESIGN_REVIEW:
    inputs:
      - story-spec
      - solution-design
      - applicability-decision        # decisions of IMPACT_ANALYSIS, API_DESIGN, DB_DESIGN (the na_checked_by check)
      - architecture-foundation
      - { key: impact-analysis, when: applicable }
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: [review-report]

  # ---------------- IMPLEMENTATION_PLANNING ----------------

  IMPLEMENTATION_PLANNING:
    inputs:
      - story-spec
      - solution-design
      - review-report                 # DESIGN_REVIEW
      - testing-strategy              # FG-01: the document does not exist yet
      - { key: impact-analysis, when: applicable }
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs:
      - implementation-plan
      - applicability-decision        # PLANNED for SECURITY_REVIEW and RECONCILIATION

  PLAN_REVIEW:
    inputs:
      - implementation-plan
      - applicability-decision        # PLANNED
      - story-spec
      - solution-design
      - testing-strategy
      - { key: impact-analysis, when: applicable }
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: [review-report]

  HUMAN_TECHNICAL_APPROVAL:
    inputs:                           # the decision package
      - solution-design
      - implementation-plan
      - applicability-decision        # TECHNICAL_DESIGN and PLANNED
      - review-report                 # DESIGN_REVIEW and PLAN_REVIEW
      - { key: impact-analysis, when: applicable }
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: []                       # R3

  # ---------------- IMPLEMENTATION ----------------

  IMPLEMENTATION:
    inputs:
      - implementation-plan
      - story-spec
      - solution-design
      - architecture-foundation
      - codebase
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: [implementation-changeset]   # code and tests — commits in the feature branch

  CODE_REVIEW:
    inputs:
      - implementation-changeset
      - implementation-plan
      - solution-design
      - architecture-foundation
      - codebase
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: [review-report]

  # ---------------- VERIFICATION ----------------

  SECURITY_REVIEW:
    inputs:
      - implementation-changeset
      - solution-design
      - review-report                 # DESIGN_REVIEW and CODE_REVIEW
      - applicability-decision        # PLANNED
      - architecture-foundation
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: [applicability-decision] # ENTRY
    outputs_if_applicable: [review-report]

  RECONCILIATION:
    inputs:
      - story-spec
      - solution-design
      - implementation-plan
      - implementation-changeset
      - review-report                 # CODE_REVIEW and SECURITY_REVIEW
      - applicability-decision        # PLANNED
      - story-history                 # triggers REC-01…REC-04 are read from history.jsonl
      - { key: api-design, when: applicable }
      - { key: db-design, when: applicable }
    outputs: [applicability-decision] # ENTRY
    outputs_if_applicable: [reconciliation-report]

  VERIFICATION:
    inputs:
      - story-spec
      - implementation-changeset
      - implementation-plan
      - testing-strategy
      - review-report                 # CODE_REVIEW and SECURITY_REVIEW
      - applicability-decision        # SECURITY_REVIEW and RECONCILIATION (na_checked_by)
      - codebase                      # in particular the current state of the target branch
      - { key: reconciliation-report, when: applicable }
    outputs: [verification-report]

  # ---------------- DELIVERY ----------------

  PR_PREPARATION:
    inputs: [verification-report, review-report, story-spec, implementation-changeset]
    outputs: [pull-request]

  HUMAN_PR_APPROVAL:
    inputs:                           # the decision package
      - implementation-changeset
      - review-report                 # CODE_REVIEW and SECURITY_REVIEW
      - verification-report
      - applicability-decision        # ENTRY from SECURITY_REVIEW and RECONCILIATION
      - pull-request
      - { key: reconciliation-report, when: applicable }
    outputs: []                       # R3

  MERGE_READINESS_CHECK:
    inputs: [pull-request, verification-report, implementation-changeset, merge-protection-policy]
    outputs: []                       # check: the result and the Merge Protection Status — in state.yaml → git and History

  HUMAN_MERGE:
    inputs: [pull-request]
    outputs: []                       # R3: CONFIRM_MERGED and the merge commit — in History

  INTEGRATION_CONFIRMATION:
    inputs:
      - pull-request
      - verification-report
      - implementation-changeset
      - codebase                      # the target branch after the merge
      - { key: implementation-plan, when: "Post-Merge Validation" }
      - { key: testing-strategy, when: "Post-Merge Validation" }
    outputs: [integration-record]
    outputs_when:
      post-merge-validation-record: "the target branch changed after VERIFICATION"
      backlog-entry: "each approved FOLLOW_UP"

# Cross-cutting outputs not bound to a single stage:
#   foundation-change-request    — any stage through BLOCKED (Foundation Change Required)
#   revalidation-record          — the owner stage of the artifact on re-entry (R2)
#   risk-acceptance-record,
#   foundation-exception-record  — the Orchestrator by a human's decision
#   cancellation-record          — the Orchestrator during CANCEL (R3)
