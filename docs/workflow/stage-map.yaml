    reviews: [IMPLEMENTATION]              # Поглиблена перевірка реалізації; архітектурний рівень — DESIGN_REVIEW (OD-05)
    context_isolation: required            # OD-10
    definition_status: APPROVED_DECISION   # Q22, OD-05
    next: RECONCILIATION
    loopbacks:
      - target: IMPLEMENTATION
      - target: IMPLEMENTATION_PLANNING
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: DB_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: API_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: SOLUTION_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: IMPACT_ANALYSIS
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: SPECIFICATION
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL, HUMAN_SPEC_APPROVAL]
      - target: CLARIFICATION
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL, HUMAN_SPEC_APPROVAL]

  - id: RECONCILIATION
    order: 16
    phase: VERIFICATION
    type: verification
    owner: traceability_auditor
    optional: true
    applicability: APPLICABILITY_RECONCILIATION
    definition_status: APPROVED_DECISION   # Q27. Лише traceability; фактичну перевірку робить VERIFICATION (WF-05)
    next: VERIFICATION
    loopbacks:
      - target: IMPLEMENTATION
      - target: IMPLEMENTATION_PLANNING
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: DB_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: API_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: SOLUTION_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: IMPACT_ANALYSIS
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: SPECIFICATION
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL, HUMAN_SPEC_APPROVAL]
      - target: CLARIFICATION
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL, HUMAN_SPEC_APPROVAL]

  - id: VERIFICATION
    order: 17
    phase: VERIFICATION
    type: verification
    owner: verifier
    optional: false                         # Базова перевірка відповідності вимогам обов'язкова завжди (Q27)
    definition_status: APPROVED_DECISION   # Q1, Q23, OD-15. Прив'язана до Changeset Content Identity і Target Base Identity (OD-12)
    next: PR_PREPARATION
    loopbacks:
      - target: IMPLEMENTATION
      - target: IMPLEMENTATION_PLANNING
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: DB_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: API_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: SOLUTION_DESIGN
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: IMPACT_ANALYSIS
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL]
      - target: SPECIFICATION
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL, HUMAN_SPEC_APPROVAL]
      - target: CLARIFICATION
        crosses_gates: [HUMAN_TECHNICAL_APPROVAL, HUMAN_SPEC_APPROVAL]

  # ---------------- DELIVERY ----------------

  - id: PR_PREPARATION
    order: 18
    phase: DELIVERY
    type: producer
    owner: delivery_coordinator
    optional: false
    reviewed_by: HUMAN_PR_APPROVAL
    definition_status: APPROVED_DECISION   # Q8, FR-01. Змінює лише метадані PR, не вміст змін (RR-10, RR-12)
    next: HUMAN_PR_APPROVAL
    loopbacks:
      - target: IMPLEMENTATION             # будь-яка потреба змінити вміст змін, зокрема конфлікт із target branch
      - target: VERIFICATION
        condition: CHANGESET_CONTENT_UNCHANGED   # змінилася лише target branch — перевірка інтеграційного результату

  - id: HUMAN_PR_APPROVAL
    order: 19
    phase: DELIVERY
    type: human_gate
    owner: pr_approver
    definition_status: APPROVED_DECISION   # Q5
    approval_scope:                # Кожен елемент має Approved Content Identity (WF-03)
      - implementation-changeset   # Changeset Content Identity
      - review-report              # лише звіти CODE_REVIEW і SECURITY_REVIEW (якщо застосовна) для цієї identity
      - reconciliation-report      # якщо RECONCILIATION застосовна
      - verification-report        # Findings Disposition, FOLLOW_UP, Target Base Identity
      - applicability-decision     # рішення, які SECURITY_REVIEW і RECONCILIATION ухвалили на вході (AP-06)
      - pull-request               # identity PR: репозиторій, PR, source і target branch, Changeset Content Identity; без метаданих (RR-12)
    decisions:
      APPROVE: MERGE_READINESS_CHECK
      RECONFIRM: MERGE_READINESS_CHECK
      REQUEST_CHANGES:
        - PR_PREPARATION
        - IMPLEMENTATION
        - IMPLEMENTATION_PLANNING
        - DB_DESIGN
        - API_DESIGN
        - SOLUTION_DESIGN
        - IMPACT_ANALYSIS
        - SPECIFICATION
        - CLARIFICATION
      CANCEL: CANCELLED

  - id: MERGE_READINESS_CHECK
    order: 20
    phase: DELIVERY
    type: check
    owner: delivery_coordinator
    optional: false
    definition_status: APPROVED_DECISION   # OD-12 (кроки 2–5), OD-16, FR-01, FR-02: перевірка перед merge, окремо від підтвердження після merge
    next: HUMAN_MERGE
    loopbacks:
      - target: VERIFICATION
        condition: CHANGESET_CONTENT_UNCHANGED   # target branch змінилася — перевірка інтеграційного результату
        crosses_gates: [HUMAN_PR_APPROVAL]
      - target: PR_PREPARATION                   # PR не відповідає погодженій identity (наприклад, інша target branch)
        crosses_gates: [HUMAN_PR_APPROVAL]
      - target: IMPLEMENTATION                   # для інтеграції потрібно змінити вміст змін
        crosses_gates: [HUMAN_PR_APPROVAL]

  - id: HUMAN_MERGE
    order: 21
    phase: DELIVERY
    type: human_action
    owner: integrator
    definition_status: APPROVED_DECISION   # Q5, Q8, OD-12 (крок 6)
    decisions:
      CONFIRM_MERGED: INTEGRATION_CONFIRMATION
      REQUEST_CHANGES: [MERGE_READINESS_CHECK, PR_PREPARATION, IMPLEMENTATION]
      CANCEL: CANCELLED

  - id: INTEGRATION_CONFIRMATION
    order: 22
    phase: DELIVERY
    type: check
    owner: delivery_coordinator
    optional: false
    definition_status: APPROVED_DECISION   # Q4, Q8, OD-11, OD-12 (кроки 7–8)
    next: DONE
    loopbacks:
      - target: HUMAN_MERGE                # merge ще не виконано
    post_merge_validation:                 # OD-16, Recovery. Частина стадії, не окрема стадія.
      check_order:
        - INTEGRATION_MATCH                # результат merge = погоджена Changeset Content Identity; інакше BLOCKED (Integration Mismatch)
        - BASE_COMPARISON                  # Target Base Identity на момент merge = перевірена → Post-Merge Validation не потрібна
        - POST_MERGE_VALIDATION            # лише якщо база змінилася: перевірка поточного стану target branch → post-merge-validation-record
        - FOLLOW_UP_BACKLOG                # backlog-entry для погоджених FOLLOW_UP
      resume_rules:                        # OD-17. Після зовнішнього виправлення і RESUME людини.
        after_post_merge_validation_failed: >-
          DONE можливий, якщо первісний Integration Match = PASS, людина дозволила RESUME, повторна
          Post-Merge Validation = PASS на поточному стані target branch і виконано всі умови DoD.
          Саме зовнішнє виправлення Story не завершує.
        after_integration_mismatch: >-
          Успішна інша Story не виправдовує первісну інтеграцію. DONE можливий лише з доказом, що
          погоджена Changeset Content Identity цієї Story інтегрована належно, і за виконання всіх
          умов DoD. Без такого доказу Story лишається BLOCKED або завершується CANCELLED рішенням людини.
        merge_binding: >-
          Integration Match оцінює результат merge, зафіксований останнім CONFIRM_MERGED. Повторний
          merge після корекції проходить через Recovery ROUTE_BACK → HUMAN_MERGE → новий
          CONFIRM_MERGED, а не через RESUME. RESUME повторює перевірки для того самого merge.
      on_fail: BLOCKED                     # Post-Merge Validation Failed, з діагностикою в post-merge-validation-record
      approval_effect: >-
        Не змінює Approval State HUMAN_PR_APPROVAL, якщо Changeset Content Identity не змінилася.
        post-merge-validation-record не входить до жодного Approval Scope.
      forbidden_actions: [merge, revert, push to target branch, автоматичне виправлення інтегрованого коду]

# ---------------------------------------------------------------------------
# Умови застосовності Optional Stages (OD-07)
# ---------------------------------------------------------------------------
# Модель погоджено (OD-07). Конкретні тригери погоджено рішенням FR-01, SEC-08 уточнено рішенням FR-03.
#
# Спільні нормативні правила для всіх умов:
#   AP-01  Стадія застосовна, якщо виконується хоча б один тригер.
#   AP-02  Якщо застосовність тригера неоднозначна, тригер вважається виконаним (стадія застосовна).
#   AP-03  NOT_APPLICABLE потребує applicability-decision: для кожного тригера — відповідь
#          «не виконується» з посиланням на джерело (артефакт і місце), на якому вона ґрунтується.
#   AP-04  applicability-decision прив'язаний до Applicability Basis — усіх релевантних фактів, на
#          яких ґрунтується рішення (WF-V2-02). Категорії релевантних фактів для кожної стадії
#          перелічено в basis_facts. Якщо релевантний факт змінився, рішення переоцінюється перед
#          використанням. Якщо висновок не змінився, створюється revalidation-record, а не новий
#          applicability-decision.
#   AP-05  Обґрунтування NOT_APPLICABLE перевіряє стадія з na_checked_by. Людина бачить його
#          на найближчому Human Gate.
#   AP-06  Оцінка виконується для фактичного стану: заплановане в implementation-plan рішення
#          стадія перевіряє на вході проти поточних артефактів і може лише розширити застосовність.
#          Рішення на вході — окремий applicability-decision у Scope HUMAN_PR_APPROVAL. Він не
#          замінює запланованого рішення зі Scope HUMAN_TECHNICAL_APPROVAL.
#   AP-07  NOT_APPLICABLE Optional Stage не звільняє від обов'язкових DESIGN_REVIEW, CODE_REVIEW
#          і VERIFICATION, зокрема від їхніх security-перевірок.
#   AP-08  Перевірка Applicability Basis перед використанням: стадія під час власного входу, стадія
#          з na_checked_by, Orchestrator під час Review Binding Guard (RR-10) і перед Human Gate.
#          Рішення зі зміненим релевантним фактом не можна використати повторно.
#   AP-09  Події, яких немає в basis_facts відповідної стадії, не інвалідують її applicability-decision.
#   AP-10  Заплановане рішення в implementation-plan (Scope HUMAN_TECHNICAL_APPROVAL) — прогноз. Його
#          basis — лише артефакти, на яких ґрунтується план. Після входу в стадію чинним є рішення
#          на вході (Scope HUMAN_PR_APPROVAL), тож події Workflow не призупиняють Technical approval.

applicability_conditions:

  APPLICABILITY_IMPACT_ANALYSIS:
    definition_status: APPROVED_DECISION   # OD-07, FR-01
    evaluated_by: IMPACT_ANALYSIS          # на вході стадії, за погодженим story-spec
    triggers:
      IA-01: Story змінює або вилучає наявну поведінку, наявний зовнішній контракт або наявну структуру даних, а не лише додає нові.
      IA-02: Story змінює компоненти, конфігурацію або код, якими користуються кілька модулів або спільна технічна інфраструктура.
      IA-03: Story потребує міграції чи перетворення даних, які вже існують.
      IA-04: Story змінює артефакти, контракти чи файли, яких торкається інша нетермінальна Story.
      IA-05: Story Type — BUG, INFRASTRUCTURE або SECURITY.
    basis_facts: [story-spec version, Story Type, codebase state зачеплених областей, Workflow State інших нетермінальних Stories]
    not_applicable_evidence: Перелік областей, яких торкається Story, і для кожного тригера — чому він не виконується.
    na_checked_by: DESIGN_REVIEW

  APPLICABILITY_API_DESIGN:
    definition_status: APPROVED_DECISION   # OD-07, FR-01
    evaluated_by: API_DESIGN               # на вході стадії, за solution-design
    triggers:
      API-01: Story додає, змінює або вилучає операцію зовнішнього інтерфейсу, формат запиту чи відповіді, коди помилок або заголовки.
      API-02: Story змінює видиму клієнту поведінку наявної операції без зміни її форми (валідація, авторизація, помилки, побічні ефекти).
      API-03: Story змінює видимий клієнту механізм автентифікації, сесій чи захисту запитів.
      API-04: solution-design посилається на зміну зовнішнього інтерфейсу.
    basis_facts: [story-spec version, solution-design version]
    not_applicable_evidence: Підтвердження, що зовнішній інтерфейс не змінюється ані формою, ані видимою поведінкою, з посиланням на solution-design.
    na_checked_by: DESIGN_REVIEW

  APPLICABILITY_DB_DESIGN:
    definition_status: APPROVED_DECISION   # OD-07, FR-01
    evaluated_by: DB_DESIGN                # на вході стадії, за solution-design
    triggers:
      DB-01: Story створює, змінює або вилучає структури збережених даних (таблиці, колонки, індекси, обмеження, структуровані ключі).
      DB-02: Story потребує міграції схеми чи даних.
      DB-03: Story змінює формат, строк життя або спосіб зберігання даних у будь-якому сховищі.
      DB-04: Story змінює гарантії цілісності чи конкурентного доступу на рівні сховища.
      DB-05: solution-design посилається на зміну збережених даних.
    basis_facts: [story-spec version, solution-design version]
    not_applicable_evidence: Підтвердження, що структура, формат і гарантії збережених даних не змінюються, з посиланням на solution-design.
    na_checked_by: DESIGN_REVIEW

  APPLICABILITY_SECURITY_REVIEW:
    definition_status: APPROVED_DECISION   # Q22, OD-05, OD-07, FR-01, FR-03
    evaluated_by: SECURITY_REVIEW          # заплановано в implementation-plan; на вході — проти поточної Changeset Content Identity
    triggers:
      SEC-01: Зміни автентифікації, авторизації, сесій, токенів або облікових даних.
      SEC-02: Зміни обробки паролів, секретів, ключів або криптографії.
      SEC-03: Зміни обробки персональних чи інших чутливих даних, зокрема в логах і відповідях.
      SEC-04: Нові чи змінені точки входу через межу довіри або розбір недовірених вхідних даних.
      SEC-05: Зміни адміністративних можливостей або перевірок прав.
      SEC-06: Нова зовнішня залежність або оновлення залежності, яка стосується безпеки.
      SEC-07: Зміни security-конфігурації (cookies, CORS, CSRF, TLS, security-заголовки, доступ до секретів).
      SEC-08: >-
        Зміни, які безпосередньо впливають на security controls або на поведінку, яку регулюють
        спеціалізовані Security Rules Project Foundation (FR-03). Код, до якого застосовуються лише
        загальні правила безпечного програмування, цей тригер не активує. Базові security-перевірки
        лишаються в DESIGN_REVIEW і VERIFICATION.
      SEC-09: Story Type — SECURITY.
      SEC-10: DESIGN_REVIEW або CODE_REVIEW зафіксували security-рішення чи finding, що потребує поглибленої перевірки реалізації.
      SEC-11: Людина вимагала SECURITY_REVIEW (на gate, у Recovery чи в рішенні щодо Loopback).
    basis_facts:
      - Changeset Content Identity               # SEC-01…SEC-08
      - версії артефактів дизайну                # SEC-01…SEC-08
      - Story Type                               # SEC-09
      - Story Risk Assessment                    # категорії ризику плану
      - findings DESIGN_REVIEW і CODE_REVIEW     # SEC-10, зокрема нові після повернення
      - рішення людини щодо застосування Review  # SEC-11
      - Recovery-рішення після BLOCKED, що змінили ризики Story
    not_applicable_evidence: Для кожного тригера — чому він не виконується, з посиланням на changeset і дизайн.
    na_checked_by: VERIFICATION

  APPLICABILITY_RECONCILIATION:
    definition_status: APPROVED_DECISION   # Q27, OD-07, FR-01
    evaluated_by: RECONCILIATION           # заплановано в implementation-plan; на вході — за History і станом Story
    triggers:
      REC-01: У Story був Loopback або повернення, що перетнули Human Gate.
      REC-02: Під час Story виконувався Foundation Change Request.
      REC-03: Застосовні щонайменше дві стадії з API_DESIGN, DB_DESIGN, IMPACT_ANALYSIS.
      REC-04: Для Story спрацював ліміт Repeated Failure або людина розширювала Retry Budget.
      REC-05: Story Type — SECURITY.
      REC-06: Людина вимагала повного Reconciliation.
    basis_facts:
      - події повернення через Human Gate             # REC-01
      - події Foundation Change Request               # REC-02
      - applicability-decision API_DESIGN, DB_DESIGN, IMPACT_ANALYSIS   # REC-03
      - Retry Counters: Repeated Failure і розширення бюджету           # REC-04
      - Story Type                                    # REC-05
      - рішення людини щодо Reconciliation            # REC-06
      - Changeset Content Identity
    not_applicable_evidence: Для кожного тригера — чому він не виконується. Базова перевірка відповідності вимогам у VERIFICATION виконується все одно.
    na_checked_by: VERIFICATION
