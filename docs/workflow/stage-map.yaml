# Workflow Definition — Stage Map
#
# Канонічна декларативна модель Story Lifecycle: стадії, порядок, логічні власники,
# дозволені переходи, Loopbacks, Human Gates, Optional Stages і термінальні стани.
#
# Це єдине джерело правил маршрутизації. Інші документи Workflow Definition посилаються
# на ідентифікатори з цього файлу і не повторюють маршрути:
#   - stages.md               — призначення, входи, виходи й умови завершення стадій;
#   - workflow-state-model.md — Workflow State, Execution State, Verdicts, Recovery, Staleness;
#   - workflow-policies.md    — Human Gates, Reviews, Autonomy, DoD, Git, режими виконання.
#
# Файл не є Artifact Contract і не є схемою state/history. Поля нижче описують Workflow,
# а не формат файлів стану. Формат стану визначає етап Artifact Contracts.
#
# Workflow Core не залежить від мови, фреймворків чи сховищ даних проєкту.
# Технологічні правила належать Project Foundation і майбутнім Stage Skills.

document:
  id: workflow-stage-map
  title: Workflow Definition — Stage Map
  status: APPROVED       # Погоджено людиною 2026-11-16 після фінального Review (revision 3).
  revision: 3
  approved_on: 2026-11-16

# Маркери походження елементів моделі.
definition_status:
  APPROVED_DECISION: >-
    Елемент прямо випливає з погоджених рішень Q1–Q28, OD-01…OD-17, погоджених Review Findings
    або рішень фінального Review FR-01…FR-03.
  DERIVED: >-
    Елемент логічно випливає з погоджених рішень, але не погоджувався окремо. У погодженій версії
    таких елементів немає: колишні DERIVED-елементи погоджено рішенням FR-01. Маркер лишається
    для майбутніх змін Workflow Definition.
# Посилання OD-*, WF-*, WF-V2-* і FR-* ведуть до розділу 14 документа workflow-policies.md.

# ---------------------------------------------------------------------------
# Перелічення
# ---------------------------------------------------------------------------

stage_types:
  producer: Створює або оновлює артефакт Story.
  review: Незалежно перевіряє артефакти producer-стадій. Не виправляє їх.
  verification: Перевіряє результат Story як ціле (тести, вимоги, traceability, DoD).
  human_gate: Точка погодження людиною. Автоматично не проходиться.
  human_action: Дія, яку виконує людина (не погодження артефакта).
  check: Агентна перевірка факту без створення контрольованого артефакта.

stage_verdicts:          # Повертає агентна стадія. Див. workflow-state-model.md.
  - PASS
  - CHANGES_REQUIRED
  - BLOCKED
  - NOT_APPLICABLE

gate_decisions:          # Ухвалює людина на human_gate / human_action. Не є Stage Verdict.
  APPROVE: Повне погодження артефактів Approval Scope з їхньою поточною Approved Content Identity.
  RECONFIRM: >-
    Скорочене повторне підтвердження чинного approval (OD-06). Доступне лише тоді, коли кожен
    артефакт Scope має ту саму Approved Content Identity, що й під час попереднього APPROVE,
    approval має стан VALID або SUSPENDED, а кожна upstream-зміна після останнього рішення
    людини покрита revalidation-record, який перевірила review-стадія. Не є погодженням
    зміненого вмісту. Не скидає Retry Counters. Auto Mode його не виконує.
  REQUEST_CHANGES: Повернути Story на одну з дозволених цілей gate через Rework Protocol (RR-11).
  CANCEL: Скасувати Story.
  CONFIRM_MERGED: >-
    Лише для HUMAN_MERGE. Людина підтверджує, що merge виконано. Якщо діє контрольована ручна
    процедура (Merge Protection Status NOT_SUPPORTED або погоджений порядок для UNAVAILABLE),
    людина також підтверджує, що дотрималася її і target branch не змінилася після
    MERGE_READINESS_CHECK, або обирає REQUEST_CHANGES на MERGE_READINESS_CHECK (RR-13).
  # Жодне рішення людини на gate не може прийняти порушення обов'язкового правила Foundation (RR-14).

recovery_actions:        # Q14. Семантика — workflow-state-model.md, розділ 9.
  - RESUME
  - ROUTE_BACK
  - CANCEL
  - KEEP_BLOCKED

recovery_route_back_targets: >-
  ROUTE_BACK у Recovery може вести на ціль із loopbacks поточної стадії або на будь-яку
  producer-стадію з меншим order. Рішення ухвалює лише людина. Усі Human Gates між ціллю
  і поточною стадією обробляються через Rework Protocol (RR-11). Виняток: з
  INTEGRATION_CONFIRMATION, коли зміни вже інтегровано, ROUTE_BACK можливий лише на цілі з її
  loopbacks. Код в target branch агент не змінює. Подальша робота над уже інтегрованими змінами —
  корекція людиною поза Story або нова пов'язана Story (OD-16). Умови DONE після зовнішнього
  виправлення — OD-17 (workflow-state-model.md, розділ 9).

route_conditions:        # Умови, з якими оголошено окремі маршрути.
  CHANGESET_CONTENT_UNCHANGED: >-
    Changeset Content Identity не змінилася відносно версії, яку перевірили CODE_REVIEW і
    SECURITY_REVIEW (якщо застосовна). Змінилася лише Target Base Identity. Порівняння за
    змістом змін, а не лише за Git SHA (OD-12).

story_types:             # OD-14. Тип фіксується в story-spec і погоджується на HUMAN_SPEC_APPROVAL.
  - FEATURE
  - BUG
  - TECHNICAL
  - INFRASTRUCTURE
  - SECURITY

retry_policy:            # OD-08
  definition_status: APPROVED_DECISION     # модель і початкові значення погоджено (OD-08, 3/3/3)
  defaults:              # погоджені початкові значення конфігурації, не незмінні глобальні константи
    technical_attempts: 3   # послідовні технічні невдачі однієї стадії
    quality_loops: 3        # окремо для кожної producer-стадії-цілі і кожної стадії-ініціатора
    repeated_failure: 3     # кількість появ однієї Finding Identity в межах Story (3 = друге повторення після виправлення)
  configuration_rule: >-
    Значення є конфігурацією Workflow Definition. Змінює їх лише людина через зміну цього файлу.
    Агент не збільшує бюджет. Додаткові спроби для конкретної Story дозволяє лише людина через
    Recovery RESUME. Правила обліку й скидання — workflow-state-model.md, розділ 10.

review_context_isolation:   # OD-10. Логічна вимога, не механізм реалізації.
  required: [DESIGN_REVIEW, CODE_REVIEW, SECURITY_REVIEW]
  risk_triggered: [SPEC_REVIEW, PLAN_REVIEW]
  risk_triggers:
    ISO-01: Story Type — SECURITY або INFRASTRUCTURE.
    ISO-02: Story змінює автентифікацію, авторизацію, сесії, облікові дані чи обробку чутливих даних.
    ISO-03: Для Story заплановано SECURITY_REVIEW (лише для PLAN_REVIEW).
    ISO-04: Артефакт, який перевіряють, створено після Loopback, що перетнув Human Gate.
    ISO-05: Для цієї review-стадії спрацював ліміт Repeated Failure або людина розширила Retry Budget.
    ISO-06: Людина вимагала ізоляції.
  ambiguity_rule: Якщо застосовність тригера неочевидна, ізоляція потрібна.

initial_state:           # Стан нової Story після її реєстрації у Workflow.
  # Передумови реєстрації — workflow-policies.md, розділ 15 (Prerequisites) і розділ 16 (Story Types).
  stage: CLARIFICATION
  story_status: ACTIVE
  execution_state: READY

loopback_confirmation_decisions:   # Рішення людини щодо Loopback із crosses_gates (RR-04).
  ROUTE_BACK: Підтвердити запропоновану ціль або обрати іншу ціль із loopbacks поточної стадії. Далі — Rework Protocol.
  RESUME: Відхилити Loopback. Story лишається на поточній стадії і починає нову спробу з урахуванням рішення людини.
  CANCEL: Скасувати Story через Cancellation Protocol.

terminal_states:
  DONE: >-
    Story завершена. Досяжна лише з INTEGRATION_CONFIRMATION з verdict PASS: інтегровано саме
    погоджені зміни, а якщо Target Base Identity змінилася до merge — Post-Merge Validation пройдена.
  CANCELLED: >-
    Story скасована рішенням людини через Cancellation Protocol (OD-13). Досяжна з будь-якого
    нетермінального стану. Повторно не відкривається: для продовження роботи створюється нова
    пов'язана Story.

# ---------------------------------------------------------------------------
# Фази (логічні етапи Q1)
# ---------------------------------------------------------------------------

phases:
  - id: CLARIFICATION
    order: 1
    definition_status: APPROVED_DECISION   # Q1
  - id: SPECIFICATION
    order: 2
    definition_status: APPROVED_DECISION   # Q1
  - id: TECHNICAL_DESIGN
    order: 3
    definition_status: APPROVED_DECISION   # Q1, Q2
  - id: IMPLEMENTATION_PLANNING
    order: 4
    definition_status: APPROVED_DECISION   # Q1
  - id: IMPLEMENTATION
    order: 5
    definition_status: APPROVED_DECISION   # Q1, Q3
  - id: VERIFICATION
    order: 6
    definition_status: APPROVED_DECISION   # Q1
  - id: DELIVERY
    order: 7
    definition_status: APPROVED_DECISION   # Q4, Q5, Q8, OD-02

# ---------------------------------------------------------------------------
# Логічні ролі (не прив'язані до конкретних Skills чи Subagents)
# ---------------------------------------------------------------------------

roles:
  agent:
    orchestrator: Застосовує переходи, веде Workflow State і History. Не виконує стадії.
    requirements_analyst: Clarification і Specification.
    requirements_reviewer: Review специфікації.
    solution_architect: Impact Analysis і Solution Design.
    api_designer: Дизайн зовнішнього інтерфейсу.
    data_designer: Дизайн збереження даних.
    design_reviewer: Review технічного дизайну.
    implementation_planner: Implementation Plan.
    plan_reviewer: Review Implementation Plan.
    implementer: Код і тести.
    code_reviewer: Review реалізації.
    security_reviewer: Security Review.
    traceability_auditor: Reconciliation.
    verifier: Verification.
    delivery_coordinator: Підготовка PR, перевірка перед merge, підтвердження інтеграції, Post-Merge Validation, backlog-entry для FOLLOW_UP.
  human:
    product_approver: HUMAN_SPEC_APPROVAL.
    technical_approver: HUMAN_TECHNICAL_APPROVAL.
    pr_approver: HUMAN_PR_APPROVAL.
    integrator: HUMAN_MERGE.
  note: Одна людина може виконувати всі людські ролі. Producer і Reviewer однієї перевірки — різні агентні ролі (Q6).

# ---------------------------------------------------------------------------
# Загальні правила маршрутизації
# ---------------------------------------------------------------------------

routing_rules:
  - id: RR-01
    rule: Перехід виконується лише за маршрутом, оголошеним у цьому файлі. Інший маршрут відхиляється.
  - id: RR-02
    rule: >-
      PASS і NOT_APPLICABLE ведуть на стадію з поля next. NOT_APPLICABLE дозволено лише стадіям
      з optional: true.
  - id: RR-03
    rule: >-
      CHANGES_REQUIRED має містити ціль із поля loopbacks поточної стадії. Стадія пропонує ціль,
      Orchestrator перевіряє її. Відсутня або недозволена ціль — переходу немає (Q13).
  - id: RR-04
    rule: >-
      Loopback із полем crosses_gates змінює артефакт, уже погоджений людиною. Такий Loopback
      виконується лише після рішення людини (Q7, Q16). Можливі рішення —
      loopback_confirmation_decisions. Auto Mode зупиняється.
  - id: RR-05
    rule: >-
      BLOCKED не має автоматичного маршруту. Story переходить у стан BLOCKED і далі — лише через
      Recovery Protocol (workflow-state-model.md).
  - id: RR-06
    rule: >-
      Після будь-якого повернення Story знову проходить усі наступні стадії за порядком. Кожна
      стадія виконує Revalidation своїх результатів (Rework Protocol, RR-11).
  - id: RR-07
    rule: >-
      Human Gate — обов'язкова точка зупинки під час кожного проходження. Gate проходиться лише
      рішенням людини: APPROVE (повне погодження) або RECONFIRM (лише за умов gate_decisions.RECONFIRM).
      Якщо Approved Content Identity будь-якого артефакта Scope змінилася або approval має стан
      INVALIDATED, доступне лише APPROVE. Auto Mode не ухвалює жодного з цих рішень (OD-06).
  - id: RR-08
    rule: >-
      CANCEL доступний людині з будь-якого нетермінального стану і веде в CANCELLED через
      Cancellation Protocol (OD-13). Агент не видаляє гілки, PR чи незакомічені зміни без явного
      дозволу людини.
  - id: RR-09
    rule: DONE досяжний лише з INTEGRATION_CONFIRMATION з verdict PASS (Q4, Q8, OD-12, OD-16).
  - id: RR-10
    rule: >-
      Review Binding Guard (WF-02). Нову версію implementation-changeset створює лише
      IMPLEMENTATION. Вхід у будь-яку стадію з order більшим за CODE_REVIEW дозволений лише
      тоді, коли для поточної Changeset Content Identity є PASS від CODE_REVIEW, а SECURITY_REVIEW
      і RECONCILIATION мають PASS або NOT_APPLICABLE для тієї самої identity (для стадій, через
      які Story вже пройшла в поточному проходженні). NOT_APPLICABLE зараховується лише тоді, коли
      Applicability Basis його applicability-decision не змінився (AP-08, WF-V2-02). Якщо умова не виконується, перехід
      відхиляється, а Story переходить у BLOCKED (Integrity Error). Відновлення — лише ROUTE_BACK
      на IMPLEMENTATION або раніше. Маршрут на стадію після CODE_REVIEW, що не проходить через
      IMPLEMENTATION, оголошується лише з condition CHANGESET_CONTENT_UNCHANGED.
  - id: RR-11
    rule: >-
      Rework Protocol (WF-04). Кожен механізм повернення застосовує ту саму процедуру Staleness,
      Approval State, повторного Review, APPROVE/RECONFIRM і подій History: Stage Loopback,
      REQUEST_CHANGES на gate або HUMAN_MERGE, loopback_confirmation ROUTE_BACK, Recovery
      ROUTE_BACK і RESUME, відновлення після Foundation Change Request, Staleness, виявлена під
      час Session Recovery, і зміна артефакта поза Workflow (workflow-state-model.md, розділ 14).
  - id: RR-12
    rule: >-
      Зміна лише метаданих PR (заголовок, опис, мітки) не змінює Changeset Content Identity і не
      вимагає нового CODE_REVIEW, VERIFICATION чи HUMAN_PR_APPROVAL. Метадані не входять до
      Approved Content Identity артефакта pull-request. Зміна фіксується в History.
  - id: RR-13
    rule: >-
      Merge Protection (OD-16, FR-02). Якщо Git-платформа підтримує механізми захисту target branch
      (Branch Protection, Required Checks, заборона merge із застарілими перевірками або еквівалент),
      вони мають використовуватися відповідно до Merge Protection Policy проєкту.
      MERGE_READINESS_CHECK фіксує Merge Protection Status і діє за merge_protection_statuses.
      Агент не змінює налаштування захисту без дозволу людини. Ручна процедура не обходить
      обов'язкових правил проєкту. Workflow Core не залежить від конкретної платформи чи
      стратегії merge.

  - id: RR-14
    rule: >-
      Foundation Rule Guard (WF-V2-01). Порушення обов'язкового правила Product, Architecture чи
      Security Foundation лишається BLOCKING. Його не усуває ні Risk Acceptance, ні рішення на gate,
      ні перекласифікація у NON_BLOCKING чи FOLLOW_UP. Вирішення — лише виправлення, погоджений
      Foundation Change Request або foundation-exception-record, якщо саме це правило Foundation
      прямо допускає виняток.

merge_protection_statuses:   # FR-02. Оцінює MERGE_READINESS_CHECK. Політика — workflow-policies.md, розділ 9.
  ACTIVE: Потрібний механізм увімкнено. Звичайна перевірка перед merge.
  NOT_SUPPORTED: >-
    Платформа не підтримує механізм. Дозволена контрольована ручна процедура, якщо Merge Protection
    Policy проєкту не вимагає саме цього механізму. Обмеження фіксується. Якщо вимагає — як DISABLED.
  UNAVAILABLE: >-
    Механізм підтримується, але об'єктивно недоступний (тарифний план, права доступу, тимчасова
    недоступність). Обмеження фіксується. MERGE_READINESS_CHECK → BLOCKED (Merge Protection
    Unavailable). Людина в Recovery погоджує допустимий порядок інтеграції (RESUME) або інший шлях.
  DISABLED: >-
    Механізм доступний, Merge Protection Policy вимагає його, але він вимкнений.
    MERGE_READINESS_CHECK → BLOCKED (Merge Protection Disabled). RESUME лише після ввімкнення
    захисту людиною або за чинним foundation-exception-record, якщо політика прямо допускає виняток
    (WF-V2-01). Ручна процедура цей випадок не замінює.
  # Механізм доступний, але не вимагається політикою й вимкнений — обробляється як UNAVAILABLE.

# ---------------------------------------------------------------------------
# Стадії
# ---------------------------------------------------------------------------

stages:

  # ---------------- CLARIFICATION ----------------

  - id: CLARIFICATION
    order: 1
    phase: CLARIFICATION
    type: producer
    owner: requirements_analyst
    optional: false
    reviewed_by: SPEC_REVIEW        # OD-03: окремої Clarification Review Stage немає
    definition_status: APPROVED_DECISION   # Q1, OD-03, OD-14
    next: SPECIFICATION
    loopbacks: []

  # ---------------- SPECIFICATION ----------------

  - id: SPECIFICATION
    order: 2
    phase: SPECIFICATION
    type: producer
    owner: requirements_analyst
    optional: false
    reviewed_by: SPEC_REVIEW
    definition_status: APPROVED_DECISION   # Q1, OD-14
    next: SPEC_REVIEW
    loopbacks:
      - target: CLARIFICATION

  - id: SPEC_REVIEW
    order: 3
    phase: SPECIFICATION
    type: review
    owner: requirements_reviewer
    optional: false
    reviews: [CLARIFICATION, SPECIFICATION]
    context_isolation: risk_triggered      # OD-10
    definition_status: APPROVED_DECISION   # Q6, Q28, OD-03
    next: HUMAN_SPEC_APPROVAL
    loopbacks:
      - target: SPECIFICATION
      - target: CLARIFICATION

  - id: HUMAN_SPEC_APPROVAL
    order: 4
    phase: SPECIFICATION
    type: human_gate
    owner: product_approver
    definition_status: APPROVED_DECISION   # Q5
    approval_scope: [clarification-record, story-spec]   # story-spec містить Story Type (OD-14)
    decisions:
      APPROVE: IMPACT_ANALYSIS
      RECONFIRM: IMPACT_ANALYSIS
      REQUEST_CHANGES: [SPECIFICATION, CLARIFICATION]
      CANCEL: CANCELLED

  # ---------------- TECHNICAL_DESIGN ----------------

  - id: IMPACT_ANALYSIS
    order: 5
    phase: TECHNICAL_DESIGN
    type: producer
    owner: solution_architect
    optional: true
    applicability: APPLICABILITY_IMPACT_ANALYSIS
    reviewed_by: DESIGN_REVIEW
    definition_status: APPROVED_DECISION   # Q26
    next: SOLUTION_DESIGN
    loopbacks:
      - target: SPECIFICATION
        crosses_gates: [HUMAN_SPEC_APPROVAL]
      - target: CLARIFICATION
        crosses_gates: [HUMAN_SPEC_APPROVAL]

  - id: SOLUTION_DESIGN
    order: 6
    phase: TECHNICAL_DESIGN
    type: producer
    owner: solution_architect
    optional: false
    reviewed_by: DESIGN_REVIEW
    definition_status: APPROVED_DECISION   # OD-01: універсальна Design Stage (Domain, Application, Integration, Infrastructure)
    next: API_DESIGN
    loopbacks:
      - target: IMPACT_ANALYSIS
      - target: SPECIFICATION
        crosses_gates: [HUMAN_SPEC_APPROVAL]
