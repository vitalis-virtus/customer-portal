# Local test infrastructure for Customer Portal (Infrastructure Bootstrap, minimal).
# Not a deployment configuration. See docs/architecture/infrastructure-bootstrap.md.
#
#   cp .env.example .env   # then set local values
#   docker compose -f compose.test.yaml --env-file .env up -d --wait postgres-test
#   docker compose -f compose.test.yaml --env-file .env --profile migrate run --rm migrate up
#   docker compose -f compose.test.yaml --env-file .env down        # add -v to drop the data volume

name: customer-portal-test

services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["migrate"]
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${TEST_POSTGRES_USER}:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/${TEST_POSTGRES_DB}?sslmode=disable

volumes:
  postgres-test-data:
